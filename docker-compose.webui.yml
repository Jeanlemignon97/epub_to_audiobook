services:
  epub_to_audiobook:
    build: .
    image: jeanlemignon97/epub-to-audiobook:local
    environment:
      AUDIOBOOK_DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MS_TTS_KEY: ${MS_TTS_KEY:-}
      MS_TTS_REGION: ${MS_TTS_REGION:-}
    ports:
      - "7860:7860"
    volumes:
      - ./audiobook_data:/data
    command: ["python3", "/app_src/main_ui.py", "--host", "0.0.0.0", "--port", "7860"]
    restart: unless-stopped
